name: Build and publish game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build static game
        run: node scripts/build.mjs
      - name: Check assets and game rules
        run: |
          node scripts/check.mjs
          node scripts/test-loading.cjs
          node scripts/test-recruit-animation.cjs
          node scripts/test-economy.cjs
          node scripts/test-rhythm.cjs
          node scripts/test-rhythm-audio.cjs
          node scripts/test-tour.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
